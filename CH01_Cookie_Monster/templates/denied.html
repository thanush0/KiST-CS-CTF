<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 500px;
            max-width: 90%;
            padding: 40px;
            background: #2b2b2b;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #ff6b6b;
        }

        p {
            color: #ddd;
            line-height: 1.6;
        }

        .hint {
            margin-top: 25px;
            padding: 15px;
            background: #181818;
            border-radius: 8px;
            color: #ffd166;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: #66b3ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">
        🍪
    </div>

    <h1>Access Denied</h1>

    <p>
        Cookie Monster says:
    </p>

    <p>
        <strong>
            "Me no need password. Me just need cookies!"
        </strong>
    </p>

    <div class="hint">
        Hint: Have you checked your cookies lately?
    </div>

    <a href="/">
        ← Go back
    </a>

</div>

</body>
</html>
