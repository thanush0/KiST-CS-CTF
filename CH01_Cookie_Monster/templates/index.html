<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cookie Monster's Secret Recipe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4efe5;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .monster {
            text-align: center;
            font-size: 70px;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #111;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="monster">
        🍪
    </div>

    <h1>Cookie Monster's Secret Recipe</h1>

    <p class="description">
        Cookie Monster has protected his secret recipe.
        Can you get access?
    </p>

    <form action="/login" method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            autocomplete="off"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="off"
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="footer">
        Cookie Monster Authentication System
    </div>

</div>

</body>
</html>
