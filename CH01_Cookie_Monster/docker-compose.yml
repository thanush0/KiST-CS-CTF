services:

  cookie-monster:
    build: .

    container_name: cookie-monster

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      FLASK_SECRET_KEY: "KiST-CS-CTF-cookie-monster-production-secret-2026"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M